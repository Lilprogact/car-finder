name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    name: Finance maths and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every module
        run: for f in app.js render.js github.js vault.js finance.js; do node --check "$f"; done
      - name: Finance unit tests
        run: node --test tests/*.test.js
      - name: No mock listings outside tests/
        run: |
          if grep -rIl --exclude-dir=tests --exclude-dir=.git --exclude=README.md -E "dealer\.example|img\.example" . ; then
            echo "::error::sample data found outside tests/"; exit 1; fi
          echo "clean"
